---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontenddb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontenddb
  template:
    metadata:
      labels:
        app: frontenddb
    spec:
      containers:
        - name: frontenddb
          image: hasancodes/coe692:frontenddb-amd64
          imagePullPolicy: Always
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: "change-me"
            - name: MYSQL_DATABASE
              value: "Account_FTMS"
