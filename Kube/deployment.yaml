apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: hasancodes/coe692:frontendservice-amd64
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: BOOKING_SERVICE_URL
              value: "http://bookingservice:8080/FitnessBookingService"
            - name: CANCEL_SERVICE_URL
              value: "http://cancelservice:8080/FitnessCancelService"
            - name: FRONTEND_DB_URL
              value: "jdbc:mysql://frontenddb:3306/Account_FTMS?useSSL=false&serverTimezone=UTC"
            - name: DB_USER
              value: "root"
            - name: DB_PASSWORD
              value: "change-me"
            - name: FTMS_JWT_SECRET
              value: "change-me-jwt-secret"
---
apiVersion: apps/v1
kind: Deployment
metadata:
